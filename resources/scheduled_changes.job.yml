# Orchestration job: (1) generate synthetic segment data into the landing
# volume, then (2) refresh the detection pipeline. Mirrors how a real feed
# (TD API + Kafka -> landing) would drive the pipeline.
resources:
  jobs:
    scheduled_changes_job:
      name: scheduled_changes_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.volume}

      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/generate_data/generate_segments.ipynb

        - task_key: refresh_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.scheduled_changes_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
