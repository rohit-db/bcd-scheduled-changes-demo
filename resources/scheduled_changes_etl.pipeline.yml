# The Lakeflow Declarative Pipeline for scheduled-change detection.
resources:
  pipelines:
    scheduled_changes_etl:
      name: scheduled_changes_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/scheduled_changes_etl"

      libraries:
        # Glob picks up every transformation file (both .sql and .py) so we can
        # demo the SAME detection logic in both languages side by side.
        - glob:
            include: ../src/scheduled_changes_etl/transformations/**

      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
        volume: ${var.volume}

      environment:
        dependencies:
          - --editable ${workspace.file_path}
