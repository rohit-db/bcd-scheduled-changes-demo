# BCD real-time trip-intelligence demo — everything on e2-demo-field-eng.
# FEVM serverless workspaces reject classic clusters (Real-Time Mode is classic-only), and FEVM's IP
# access list blocks e2-demo from reaching FEVM Lakebase, so stream, Lakebase, jobs and app live here.
bundle:
  name: bcd_trip_intel_rtm

sync:
  paths:
    - ../../src

variables:
  catalog:
    description: Catalog for volumes and pipeline tables
  schema:
    description: Schema for volumes and pipeline tables
  lakebase_host:
    description: Lakebase read/write DNS for this target's instance
  secret_scope:
    description: Secret scope holding lakebase-password, lakebase-host, analytics-schema
  app_name:
    description: Databricks App name (unique per workspace)
  checkpoint_root:
    default: /Volumes/${var.catalog}/${var.schema}/trip_intel_checkpoints
  landing_path:
    default: /Volumes/${var.catalog}/${var.schema}/trip_intel_landing/pnr_versions
  kinesis_stream:
    description: Kinesis stream the bronze table also reads; empty = landed files only
    default: ""
  kinesis_region:
    default: us-east-1
  kinesis_credential:
    description: UC service credential for Kinesis (read-only)
    default: kinesis_reader_cred_uat

targets:
  e2demo:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: users
      schema: rohit_bhagwat
      lakebase_host: ep-spring-rice-d1tg6e60.database.us-west-2.cloud.databricks.com
      secret_scope: rohit-bcd-trip-intel
      app_name: rohit-bcd-trip-intel
    # BCD UAT requires Apps to be deployed from a Git repository, so the app is defined per target.
    resources:
      # The stream's decisions (change_events, rule_hits, action_outbox, ...) live in Lakebase; registering the
      # database in Unity Catalog makes them queryable from SQL and Genie next to the gold tables.
      database_catalogs:
        trip_intel_ops:
          name: rohit_bcd_trip_intel_ops
          database_instance_name: rohit-bcd-trip-intel
          database_name: databricks_postgres
      apps:
        # Ops Console, Rule Studio, Traveler view. App root is src/ so it can import trip_intel.
        trip_intel_app:
          name: ${var.app_name}
          description: BCD real-time trip intelligence demo
          source_code_path: ../../src
          resources:
            - name: lakebase-password
              secret:
                scope: ${var.secret_scope}
                key: lakebase-password
                permission: READ
            - name: lakebase-host
              secret:
                scope: ${var.secret_scope}
                key: lakebase-host
                permission: READ
            - name: analytics-schema
              secret:
                scope: ${var.secret_scope}
                key: analytics-schema
                permission: READ
            - name: llm
              serving_endpoint:
                name: databricks-claude-sonnet-5-5
                permission: CAN_QUERY
            - name: warehouse
              sql_warehouse:
                id: ${resources.sql_warehouses.trip_intel_wh.id}
                permission: CAN_USE

  # BCD's UAT workspace (bcd-api-uat). Everything lands in schema bcd_api_uat.databricks_demo.
  uat:
    mode: development
    workspace:
      host: https://dbc-24f136f2-50df.cloud.databricks.com
    variables:
      catalog: bcd_api_uat
      schema: databricks_demo
      lakebase_host: ep-bitter-fog-d2w6wju5.database.us-east-1.cloud.databricks.com
      secret_scope: databricks-trip-intel
      app_name: databricks-bcd-trip-intel
      kinesis_stream: uat01-HermesTripsDS   # bronze also reads BCD's real feed (read-only)

resources:
  volumes:
    trip_intel_checkpoints:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: trip_intel_checkpoints
    trip_intel_landing:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: trip_intel_landing

  pipelines:
    # Batch lane: Lakeflow pipeline (serverless, triggered hourly) — bronze -> silver -> gold.
    trip_intel_batch_pipeline:
      name: trip_intel_batch_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: ../../src
      libraries:
        - glob:
            include: ../../src/batch_lane/transformations/**
      configuration:
        landing_path: ${var.landing_path}
        kinesis_stream: ${var.kinesis_stream}
        kinesis_region: ${var.kinesis_region}
        kinesis_credential: ${var.kinesis_credential}

  sql_warehouses:
    trip_intel_wh:
      name: ${var.app_name}-wh
      cluster_size: 2X-Small
      max_num_clusters: 1
      auto_stop_mins: 10
      enable_serverless_compute: true
      warehouse_type: PRO

  jobs:
    # Real-time lane: Spark Structured Streaming Real-Time Mode on a single-node classic cluster.
    trip_intel_rtm:
      name: trip_intel_rtm
      max_concurrent_runs: 1
      tasks:
        - task_key: rtm
          job_cluster_key: rtm
          spark_python_task:
            python_file: ../../src/rtm/job.py
            parameters:
              - --source
              - rate
              - --rows-per-second
              - "15"
              - --lakebase-host
              - ${var.lakebase_host}
              - --secret-scope
              - ${var.secret_scope}
              - --checkpoint
              - ${var.checkpoint_root}/rtm_v4
          libraries:
            - pypi:
                package: psycopg[binary]>=3.2
      job_clusters:
        - job_cluster_key: rtm
          new_cluster:
            spark_version: 18.2.x-scala2.13   # docs: Python RTM below 5 records/s adds latency before DBR 18.2
            runtime_engine: STANDARD          # docs: turn off Photon for Real-Time Mode
            node_type_id: m5d.2xlarge
            num_workers: 0
            aws_attributes:
              availability: ON_DEMAND   # a spot reclaim killed a run; the demo stream must not depend on spot
              first_on_demand: 1
            data_security_mode: SINGLE_USER
            single_user_name: ${workspace.current_user.userName}
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
              spark.databricks.streaming.realTimeMode.enabled: "true"
              spark.sql.shuffle.partitions: "4"
              spark.sql.streaming.stateStore.providerClass: org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
            cluster_log_conf:
              volumes:
                destination: ${var.checkpoint_root}/cluster_logs
            custom_tags:
              ResourceClass: SingleNode

    # Outbox dispatcher: serverless, restarted hourly; SIMULATED mode when no EventBridge bus is configured.
    trip_intel_dispatcher:
      name: trip_intel_dispatcher
      max_concurrent_runs: 1
      trigger:
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: dispatch
          environment_key: default
          spark_python_task:
            python_file: ../../src/dispatcher/dispatch.py
            parameters: ["--lakebase-host", "${var.lakebase_host}", "--secret-scope", "${var.secret_scope}",
                         "--run-minutes", "55"]
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - psycopg[binary]>=3.2
              - boto3

    # Batch lane orchestration: land the next slice of versions, then refresh the Lakeflow pipeline.
    trip_intel_batch:
      name: trip_intel_batch
      trigger:
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: land_versions
          environment_key: default
          spark_python_task:
            python_file: ../../src/batch_lane/land_versions.py
            parameters: ["--landing-path", "${var.landing_path}"]
        - task_key: refresh_pipeline
          depends_on:
            - task_key: land_versions
          pipeline_task:
            pipeline_id: ${resources.pipelines.trip_intel_batch_pipeline.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
