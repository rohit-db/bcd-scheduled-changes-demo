[project]
name = "bcd_scheduled_changes_demo"
version = "0.0.1"
authors = [{ name = "rohit.bhagwat@databricks.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pyspark",
    "fastapi",
    "httpx",
    "uvicorn",
    "psycopg-pool>=3.2",
    "databricks-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 125

[tool.hatch.build.targets.wheel]
packages = ["src/trip_intel", "src/rtm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
