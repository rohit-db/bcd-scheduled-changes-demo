[project]
name = "bcd_scheduled_changes_demo"
version = "0.0.1"
authors = [{ name = "rohit.bhagwat@databricks.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    # Runtime deps for jobs/pipelines go here. For pipelines, prefer the
    # 'environment' block in the pipeline.yml (deps are cached in dev).
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 125
